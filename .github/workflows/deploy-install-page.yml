name: Deploy Bridge install page

on:
  workflow_dispatch:
  # A successful preview publication redeploys the page, so its release snapshot is never a
  # release behind. GITHUB_TOKEN-created releases start no workflow of their own. The trigger
  # matches a workflow by name, so the job also requires a manual run from this repository.
  workflow_run:
    workflows: ["Publish MCPB preview release"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridge-install-page
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The install page reads this snapshot when the unauthenticated GitHub API refuses it
      # (60 requests an hour per address). A failed or empty read stops the deploy rather than
      # publishing a list that says no release exists.
      - name: Snapshot releases for the install page
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --paginate reads every page; --jq then prints one release per line, and jq -s collects them.
          gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | {tag_name, draft, prerelease, published_at, assets: [.assets[] | {name, browser_download_url}]}' \
            | jq -s . > site/releases.json
          # Counted with the page's own predicate, so the deploy and the page agree on what installs.
          count="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { isInstallablePreview } from "./site/release-catalog.mjs"; console.log(JSON.parse(readFileSync("site/releases.json", "utf8")).filter(isInstallablePreview).length);')"
          if [ "${count}" -lt 1 ]; then
            echo "release snapshot has no installable mcp-preview release; refusing to deploy" >&2
            exit 1
          fi
          echo "release snapshot: ${count} installable mcp-preview releases"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
