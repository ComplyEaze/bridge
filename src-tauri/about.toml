accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# cargo-about 0.9.x uses local sources and does not query clearlydefined.io.
workarounds = ["ring", "rustls"]

# Generate one notice covering every desktop target that Bridge supports.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

private = { ignore = true }

# openssl-src is a wrapper crate (MIT OR Apache-2.0) that carries and builds the OpenSSL
# source, which is under the Apache License 2.0 alone. The report names the licence of the
# code the Windows build compiles, with the licence file that ships beside that source.
# The checksum pins the file. A mismatch (a new openssl-src release with a different file)
# does not stop the generation: cargo-about only logs a warning and the report falls back to
# "MIT OR Apache-2.0" for the crate. scripts/check-license-metadata.mjs (license:all, run by
# CI) fails when the committed report does not name "License: Apache-2.0" for the locked
# openssl-src version, so a fallback in a regenerated report cannot be committed.
[openssl-src]
clarify = { license = "Apache-2.0", files = [{ path = "openssl/LICENSE.txt", checksum = "7d5450cb2d142651b8afa315b5f238efc805dad827d91ba367d8516bc9d49e7a", license = "Apache-2.0" }] }

# sqlcipher-src declares "MIT AND BSD-3-Clause AND blessing AND WTFPL" for everything it carries.
# The build compiles only its SQLCipher amalgamation, sqlcipher/sqlcipher.c (libsqlite3-sys's
# build.rs takes source_dir() and SOURCE_FILE alone; the crypto is OpenSSL on Windows and
# CommonCrypto on macOS). That file is SQLCipher's code under BSD-3-Clause and SQLite's, which
# is in the public domain (the "blessing") and carries no licence terms. The libtomcrypt files,
# the WTFPL part, are not compiled. The report names the crate's own MIT licence and SQLCipher's
# BSD-3-Clause, each with its file, pinned by checksum as for openssl-src above (#2432).
[sqlcipher-src]
clarify = { license = "MIT AND BSD-3-Clause", files = [{ path = "LICENSE", checksum = "413f82e0f4f8191a8624a7b7b2c9809466f7f3d930ad52a74ad29f2dd907881d", license = "MIT" }, { path = "sqlcipher/LICENSE-sqlcipher", checksum = "2a2826f6acf46fa650730cf42cbb22a642be33a7ef119c9c4f4bf6daf3bef48e", license = "BSD-3-Clause" }] }
