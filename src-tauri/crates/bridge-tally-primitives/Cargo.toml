[package]
name = "bridge-tally-primitives"
version = "0.1.0"
description = "Portable Tally value types (exact decimal, validated date, visible text) shared below bridge-tally-core"
license = "Apache-2.0"
repository = "https://github.com/ComplyEaze/bridge"
publish = false
edition = "2021"
rust-version = "1.96"

[lints]
workspace = true

[dependencies]
icu_properties = "2.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
proptest = "1.7"
