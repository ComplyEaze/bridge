name: Node suite on Windows

# The Node test suite (scripts/*.test.mjs) on windows-latest, where bridge#1471 measured 107 of 608
# tests failing. Every one now passes or is skipped, so any failing test turns this job red. A skip
# is the test's own decision on this host: 43 of 800 in the run that measured it (a POSIX stand-in
# `cargo` in the egress-boundary test, a POSIX `gh` stub in the version test, `cargo audit` absent
# from the runner, and a few cases that skip win32, `chmod` and `mkfifo` by design). It runs on pull
# requests and in the merge queue so that it can be added to the repository ruleset's required
# status checks: that is a ruleset setting, not a file in this repository (the check is named by the
# job name below).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: node-windows-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  node-windows:
    name: Node suite (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      # The same command as the first part of `pnpm test`, under bash because the suite's own tests
      # call bash and jq (a test whose tool or platform feature is missing skips itself). failglob
      # makes a glob that matches no test file an error instead of a run of zero tests.
      - name: Run the Node suite
        shell: bash
        run: |
          shopt -s failglob
          node --experimental-strip-types --test scripts/*.test.mjs
