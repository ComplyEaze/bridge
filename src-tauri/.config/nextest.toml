# Hang guard for the native test run (bridge#1000). Nextest reads this file from the
# workspace root, which is src-tauri, not the repository root. Its main job: a test
# that deadlocks is terminated, and the run fails, instead of holding the job until its
# time limit. (One override at the end shows what the Windows access tests print.) The slowest real tests take 41 to 69 s at the runner's own thread count (measured
# 5 Oct 2026: 61 to 69 s on macOS, 41 to 44 s on Windows) and up to 90 s on Windows at twelve
# threads, and several wait out 20 to 40 s deadlines on purpose, so a test is marked slow after
# 60 s and terminated after six such periods (six minutes), at least four times the slowest real
# test.
#
# There are deliberately no retries here. A retry could hide a real race in code that
# posts to accounting books; CI passes `--retries 0` and the thread count on its own
# command line, and this file sets neither.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 6 }

# The Windows access tests that open a file print its owner and access list as SDDL, so a
# passing run still records the runner's real state (its owner and access lists), not only a
# failing one.
[[profile.default.overrides]]
filter = 'test(/access::tests::on_windows::/)'
success-output = "immediate"

# Per-test timings for the native macOS job (bridge#1750): a JUnit report of test names, binaries,
# times and outcomes. The two store settings keep captured output out of it, passing or failing; a
# FAILING test's panic text still reaches the report whatever they say, so CI uploads the report from
# the macOS job (a diagnostics artifact kept 7 days) only when the test step passed. The consistency
# check pins every line of this file that is not a blank or a comment (nextestLines in
# scripts/check-ci-workflow-consistency.mjs), so a setting added or changed here is changed there too.
[profile.default.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = false
