accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# cargo-about 0.9.x uses local sources and does not query clearlydefined.io.
workarounds = ["ring", "rustls"]

# Generate one notice covering every desktop target that Bridge supports.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

private = { ignore = true }

# openssl-src is a wrapper crate (MIT OR Apache-2.0) that carries and builds the OpenSSL
# source, which is under the Apache License 2.0 alone. The report names the licence of the
# code the Windows build compiles, with the licence file that ships beside that source.
# The checksum pins the file: a new openssl-src release with a different file fails the
# generation until the entry is read against it.
[openssl-src]
clarify = { license = "Apache-2.0", files = [{ path = "openssl/LICENSE.txt", checksum = "7d5450cb2d142651b8afa315b5f238efc805dad827d91ba367d8516bc9d49e7a", license = "Apache-2.0" }] }
