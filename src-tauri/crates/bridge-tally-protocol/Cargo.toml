[package]
name = "bridge-tally-protocol"
version = "0.1.0"
description = "Portable Tally wire decoding and XML protocol for Bridge"
license = "Apache-2.0"
repository = "https://github.com/ComplyEaze/bridge"
publish = false
edition = "2021"
rust-version = "1.96"

[features]
default = []
bills-native-outstandings-probe = []

[lints]
workspace = true

[dependencies]
anyhow = "1"
bridge-tally-primitives = { path = "../bridge-tally-primitives" }
icu_properties = "2.2"
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"

[dev-dependencies]
proptest = "1.7"
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
tally-protocol-simulator = { path = "../tally-protocol-simulator" }
