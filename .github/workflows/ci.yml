name: Bridge CI

on:
  push:
    # Only master. A branch push needs no run of its own: a branch worth
    # checking has a pull request, and that is what triggers below.
    branches: [master]
  pull_request:
    # Deliberately unfiltered by base branch. Filtering to `[master]` meant a
    # pull request stacked on another branch got no run at all, and reported
    # `mergeStateStatus: CLEAN` off the one check that is not this workflow --
    # a green that said only "nothing required failed", never "the suite ran".
    # A stack then accumulated unchecked changes until its root merged, so the
    # first real run faced several pull requests' worth of change at once.
    types: [opened, reopened, synchronize, ready_for_review]
  # The merge queue's temporary branch (gh-readonly-queue/master/...) is the exact
  # tree that will land; a required check must be reported on it under the same name.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  # A daily full run on master. A push skips a family of heavy jobs when the merge queue already
  # ran that family on the same commit (scripts/master-push-reuse.mjs), so this run keeps the
  # Rust caches warm (saved only by push, manual and scheduled runs) and exercises the tip even
  # when no change triggers a run.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  # A pull request's newer push supersedes its older run. Master pushes share one group
  # and never cancel a run that has started: a push whose run is still waiting for the
  # group is replaced by the next push's run (GitHub keeps one pending run per group), so
  # a burst of merges runs the tip and the run in progress, not every commit at once
  # (each of them holds two macOS jobs and the merge queue waits behind them). The tip
  # always runs, but after the run in progress finishes: master pushes no longer run side
  # by side. A replaced commit gets no push run of its own, and two checks that read a
  # push's before..after range then skip it: the push-mode acknowledgement check
  # (scripts/check-surface-ack.mjs; every commit that landed through the merge queue was
  # checked in merge_group mode first) and the Cargo, toolchain and workflow triggers that
  # force a full run (scripts/master-push-reuse.mjs). The daily run covers neither: it
  # checks the acknowledgement files only and runs both systems for every job. Every other
  # run (the merge queue, a scheduled or manual run) gets a group of its own, so none is
  # cancelled or dropped.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'master-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Determine bundle scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only to read this workflow's own merge-queue runs and their jobs (scripts/master-push-reuse.mjs).
      actions: read
      # Only to read whether a pull request is still a draft when its draft run starts.
      pull-requests: read
    outputs:
      bundle: ${{ steps.scope.outputs.bundle }}
      bundle_os: ${{ steps.scope.outputs.bundle_os }}
      draft: ${{ steps.scope.outputs.draft }}
      native: ${{ steps.scope.outputs.native }}
      native_os: ${{ steps.scope.outputs.native_os }}
      tax_audit: ${{ steps.scope.outputs.tax_audit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GH_TOKEN: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.token || '' }}
        run: |
          set -euo pipefail

          # native_os and bundle_os are the systems the native, bundle-smoke and seam-control matrices run on. The macOS
          # native tests run on a push to master, on a scheduled or manual run and on a release pull request (the owner's
          # rule of 26 Oct 2026), never on another pull request or in the merge queue. The macOS bundle and seam jobs run
          # on a scheduled or manual run and on a release pull request, and in the queue or on a push only when a packaging
          # path below changed. Another pull request runs the bundle and seam jobs on Windows only.
          windows='["windows-latest"]'
          both='["windows-latest", "macos-latest"]'
          # Packaging paths: src-tauri/tauri.conf.json, src-tauri/icons/, src-tauri/build.rs (it copies the bundled legal
          # files), LICENSE, NOTICE, THIRD_PARTY_LICENSES.txt, THIRD_PARTY_LICENSES_RUST.txt, packaging/ (the MCPB manifest
          # and the PDFium lock), package.json (the Tauri CLI and its build script), this workflow, and the scripts the
          # bundle job runs: fetch-pdfium, capture-package-log, check-mcpb-bundle, package-mcpb, check-license-metadata,
          # check-dependency-inventory, check-macos-bundle-resources and check-no-test-seam, with their tests. Also what
          # pins the bundler and the build: pnpm-lock.yaml, .node-version, rust-toolchain.toml, .cargo/ and
          # src-tauri/Cargo.lock, Cargo.toml and .cargo/, and the Rust port of check-mcpb-bundle in src-tauri/examples/.
          packaging_paths='^(\.github/workflows/ci\.yml$|packaging/|package\.json$|pnpm-lock\.yaml$|\.node-version$|rust-toolchain\.toml$|\.cargo/|src-tauri/(tauri\.conf\.json$|icons/|build\.rs$|Cargo\.(lock|toml)$|\.cargo/|examples/check_mcpb_bundle\.rs$)|LICENSE$|NOTICE$|THIRD_PARTY_LICENSES(_RUST)?\.txt$|scripts/(fetch-pdfium(\.test)?\.mjs|capture-package-log(\.test)?\.mjs|check-mcpb-bundle(\.test)?\.py|package-mcpb\.mjs|check-license-metadata\.mjs|check-dependency-inventory\.mjs|check-macos-bundle-resources(\.mutation)?\.mjs|check-no-test-seam(\.test)?\.mjs)$)'

          # A draft pull request runs no native, bundle or seam job; every other job is scoped as below. Marking it ready
          # (`ready_for_review`, a trigger above) starts a new run of the same head that is scoped in full (and cancels this
          # one if it is still running), and Required checks there needs those jobs again. The merge queue's run is never a draft run. Only the
          # exact payload value `true` is a draft, and then the pull request is read again: a re-run of an old draft run
          # keeps its payload, and a push made just before the ready click can start its run after the ready run. A pull
          # request that is no longer a draft, or whose state cannot be read, is scoped in full.
          draft=false
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_DRAFT" == "true" ]]; then
            live_draft="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .draft)" || live_draft=unreadable
            if [[ "$live_draft" == "true" ]]; then draft=true; fi
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

          # The unscoped run: every heavy job runs, whatever changed. Its caller writes the systems first.
          full_run() {
            echo 'bundle=true' >> "$GITHUB_OUTPUT"
            echo 'native=true' >> "$GITHUB_OUTPUT"
            echo 'tax_audit=true' >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            { echo "native_os=$both"; echo "bundle_os=$both"; } >> "$GITHUB_OUTPUT"
            full_run
          fi

          # A push to master runs a family of heavy jobs on Windows unless the merge queue already RAN that
          # family on this exact commit and it passed (scripts/master-push-reuse.mjs). A queue run that skipped
          # the family by scope is no evidence, so it is run here as it always was. Any error or doubt
          # in the lookup runs both: a non-zero exit discards whatever was printed (its status goes to the job
          # summary), and only an exact
          # `reuse_<family>=true` line among the first two skips anything. tax_audit is cheap and always runs on a push.
          # The queue never runs the macOS native tests, so a push always does. It runs the macOS bundle and seam jobs
          # when it changes a packaging path, or when its before commit cannot be compared.
          # To turn the reuse off, delete the reuse lookup: every push then runs the Windows jobs again.
          if [[ "$EVENT_NAME" == "push" ]]; then
            lookup_status=0
            decision="$(node scripts/master-push-reuse.mjs)" || lookup_status=$?
            if [[ "$lookup_status" -ne 0 ]]; then decision=''; fi
            printf '%s\n' "$decision"
            { echo '### Master push reuse'; echo '```'; printf '%s\n' "$decision"; echo '```'; echo "Lookup exit status: $lookup_status"; } >> "$GITHUB_STEP_SUMMARY"
            reused() { printf '%s\n' "$decision" | head -n 2 | grep -qx "reuse_$1=true"; }
            packaging=true
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && pushed_files="$(git diff --name-only --no-renames -z "$BEFORE_SHA" "$GITHUB_SHA" | tr '\0' '\n')" && ! grep -Eq "$packaging_paths" <<< "$pushed_files"; then
              packaging=false
            fi
            echo 'native=true' >> "$GITHUB_OUTPUT"
            if reused native; then
              echo 'native_os=["macos-latest"]' >> "$GITHUB_OUTPUT"
            else
              echo "native_os=$both" >> "$GITHUB_OUTPUT"
            fi
            if reused bundle && [[ "$packaging" == true ]]; then
              { echo 'bundle=true'; echo 'bundle_os=["macos-latest"]'; } >> "$GITHUB_OUTPUT"
            elif reused bundle; then
              { echo 'bundle=false'; echo "bundle_os=$windows"; } >> "$GITHUB_OUTPUT"
            elif [[ "$packaging" == true ]]; then
              { echo 'bundle=true'; echo "bundle_os=$both"; } >> "$GITHUB_OUTPUT"
            else
              { echo 'bundle=true'; echo "bundle_os=$windows"; } >> "$GITHUB_OUTPUT"
            fi
            echo 'tax_audit=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$MERGE_GROUP_BASE_SHA"
          fi

          # A release pull request is the version pull request of docs/release-process.md: `next-version.mjs --apply` changes
          # the version in src-tauri/tauri.conf.json, so a pull request or queue entry whose version differs from its base's
          # is one. A version that cannot be read on one side only counts as a difference. It runs both systems for the
          # native, bundle and seam jobs, in the queue as well.
          version_at() {
            { git show "$1:src-tauri/tauri.conf.json" | grep -m1 -o '"version": *"[^"]*"'; } 2>/dev/null || true
          }
          release=false
          if [[ -n "$base" && ! "$base" =~ ^0+$ && "$(version_at "$base")" != "$(version_at "$GITHUB_SHA")" ]]; then release=true; fi
          if [[ "$release" == true ]]; then
            echo "native_os=$both" >> "$GITHUB_OUTPUT"
          else
            echo "native_os=$windows" >> "$GITHUB_OUTPUT"
          fi
          # A missing base has no useful predecessor. Keep the conservative path.
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            if [[ "$EVENT_NAME" == "merge_group" ]]; then echo "bundle_os=$both" >> "$GITHUB_OUTPUT"; else echo "bundle_os=$windows" >> "$GITHUB_OUTPUT"; fi
            full_run
          fi

          # --no-renames lists a moved file under both paths, so a file moved out of a gated directory still selects it.
          # -z: git would otherwise quote a path with non-ASCII bytes, and the quoted form matches no prefix below.
          changed_files="$(git diff --name-only --no-renames -z "$base" "$GITHUB_SHA" | tr '\0' '\n')"
          if [[ "$draft" == false ]] && grep -Eq '^(\.github/workflows/|\.github/actions/|rust-toolchain\.toml|glama/Dockerfile$|src-tauri/|scripts/package-mcpb\.mjs|scripts/check-no-test-seam(\.test)?\.mjs|scripts/check-tally-egress-boundary(\.test)?\.mjs|scripts/tally-egress-census\.json|scripts/testdata/egress-census-|\.cargo/|\.gitattributes$|package\.json$|packaging/mcpb/manifest\.json$|packaging/pdfium/|docs/adr/0016-master-binding-authority\.md$|docs/agent/README\.md$|docs/legal/terms\.md$|docs/tally/compatibility/compatibility-surface\.json$|LICENSE$|NOTICE$|THIRD_PARTY_LICENSES(_RUST)?\.txt$|scripts/(fixtures/|fetch-pdfium\.mjs$|check-tally-request-builder-hazards\.mjs$|collect-macos-test-crashes(\.test)?\.mjs$|retain-macos-test-binaries(\.test)?\.mjs$))' <<< "$changed_files"; then
            echo 'native=true' >> "$GITHUB_OUTPUT"
          else
            echo 'native=false' >> "$GITHUB_OUTPUT"
          fi

          # The mutation records check runs when the crate it guards changes, or this workflow does.
          if grep -Eq '^(\.github/workflows/ci\.yml|src-tauri/crates/bridge-tax-audit/)' <<< "$changed_files"; then
            echo 'tax_audit=true' >> "$GITHUB_OUTPUT"
          else
            echo 'tax_audit=false' >> "$GITHUB_OUTPUT"
          fi

          if [[ "$draft" == false ]] && grep -Eq '^(\.github/workflows/ci\.yml|\.github/actions/setup-windows-native/|packaging/mcpb/|package\.json|pnpm-lock\.yaml|\.node-version|vite\.config\.ts|tsconfig\.json|postcss\.config\.js|index\.html|src/|src-tauri/(src/|crates/|examples/|Cargo\.lock|Cargo\.toml|.*/Cargo\.toml|tauri\.conf\.json|build\.rs|icons/)|LICENSE$|NOTICE$|THIRD_PARTY_LICENSES\.txt$|THIRD_PARTY_LICENSES_RUST\.txt$|packaging/pdfium/|scripts/(fetch-pdfium(\.test)?\.mjs|capture-package-log(\.test)?\.mjs|check-mcpb-bundle(\.test)?\.py|package-mcpb\.mjs|check-license-metadata\.mjs|check-dependency-inventory\.mjs|check-windows-bundle-resources\.ps1|check-macos-bundle-resources(\.mutation)?\.mjs|check-no-test-seam(\.test)?\.mjs)$|\.cargo/|src-tauri/\.cargo/)' <<< "$changed_files"; then
            echo 'bundle=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bundle=false' >> "$GITHUB_OUTPUT"
          fi

          if [[ "$release" == true ]] || { [[ "$EVENT_NAME" == "merge_group" ]] && grep -Eq "$packaging_paths" <<< "$changed_files"; }; then
            echo "bundle_os=$both" >> "$GITHUB_OUTPUT"
          else
            echo "bundle_os=$windows" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    # The Playwright system packages are about 125 MB from the runner's apt mirror. Normally that takes about 30 s,
    # but on 2 Oct 2026 one runner fetched at a steady 77 kB/s, which needs about 27 minutes, and the old 15-minute
    # limit cancelled the job (and, in the merge queue, dropped the entry). The install step limits each apt attempt
    # to 600 s and ends itself in most cases; this limit bounds the rest (see the install step for the worst case).
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run license:check
      # The browser download hung until the job's time limit about eight times in two days
      # (bridge#998). The browsers are cached by Playwright version and runner OS. A hit
      # installs only the system packages; a miss downloads, with a short timeout per
      # attempt and a bounded number of attempts, so a hung download fails fast and is
      # tried again instead of burning the job. Only this download is retried, never a test.
      - name: Read the Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          # The runner image the job is on. The packages cached below are the ones apt chose on that image; an image
          # without this variable shares one key, which is safe (see the install step) and only costs a re-download.
          echo "image=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      # Restored here and saved by the "Save Playwright browsers" step after the install, not by the combined cache action,
      # so that only a push, manual or scheduled run writes the cache: a pull-request ref's copy is readable by that ref
      # alone (15 Oct 2026: five such copies, 1.8 GiB of a 10 GiB cap).
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # The system packages Playwright needs are about 115 MB from the runner's apt mirror, and in the two bursts of
      # 26 and 27 Oct 2026 that mirror gave 8 to 80 kB/s: 45 of 512 install steps (22 of them in the merge queue) used
      # all three attempts and failed (bridge#2056). The downloaded .deb files are cached like the browsers, by
      # Playwright version and runner image, restored here and saved after a successful install by a push, manual or
      # scheduled run only, so that no pull-request or merge-queue run can write what the next run installs from.
      - name: Restore Playwright system packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ steps.playwright-version.outputs.image }}
      - name: Install Playwright browsers and system dependencies
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
          DEBS_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
          APT_ARCHIVES: /var/cache/apt/archives
        run: |
          # The system packages are installed by apt, as root, so the `timeout` that limits them runs as root too. On
          # 2 Oct 2026 a `timeout` run as the runner user stopped Playwright but could not signal the root apt-get that
          # Playwright had started through sudo; it kept the dpkg lock, and attempts 2 and 3 failed at once with "Could
          # not get lock /var/lib/dpkg/lock-frontend". Here `node` itself runs as root, on an ephemeral runner image:
          # Playwright then sees uid 0 and starts apt without sudo, so apt and its download processes stay in
          # `timeout`'s process group and the limit kills all of them. `Dpkg::Use-Pty "0"` keeps dpkg in that group too
          # (with a pty, apt starts dpkg in its own session). The limit is needed because apt's own timeout restarts on
          # every byte: on 7 Oct 2026 its package-list update wrote nothing for 39 minutes, on an image that sets that
          # timeout to 15 s (bridge#1426). 600 s covers update, download and unpack, normally under a minute. apt keeps
          # finished packages between attempts and resumes a partial one, so three attempts still fit the 77 kB/s mirror
          # of 2 Oct, with no margin. apt also waits for the dpkg lock, within reason, rather than failing.
          # Worst case: three attempts that reach the limit end with the `exit 1` below about 31 minutes into the job.
          # Two of them, a slow third that succeeds, a browser cache miss and three timed-out downloads take about
          # 44 minutes; the job's own time limit (40 minutes, see its header) then ends it, as loudly as `exit 1`.
          printf '%s\n' 'DPkg::Lock::Timeout "150";' 'Dpkg::Use-Pty "0";' | sudo tee /etc/apt/apt.conf.d/99-bridge-lock-timeout > /dev/null
          # Cached packages go into apt's own archive directory, where apt takes them in place of a download, and only
          # after each one is checked against the package index, which the runner's signed release files vouch for.
          # The index is updated first (limited to 120 s, because apt's own timeout restarts on every byte); if that
          # fails nothing is copied and the install downloads as it does on a miss. A file is copied only if it is a
          # regular file (not a link) named name_version_architecture.deb in the form apt gives its downloads, and its
          # SHA-256 equals one the index lists for that package, version and architecture; every other file is
          # deleted. So a cache that holds a changed, cut-off or stale package costs a download and nothing more.
          # What apt itself does with a cached file of the right name and size has not been measured (bridge#2056).
          marker="$(mktemp)"
          if [ "$DEBS_HIT" = "true" ] && sudo timeout --kill-after=10 120 apt-get update -qq; then
            for deb in "$HOME"/apt-debs/*.deb; do
              if [ ! -f "$deb" ] || [ -L "$deb" ]; then continue; fi
              file="${deb##*/}"
              base="${file%.deb}"
              name="${base%%_*}"
              rest="${base#*_}"
              version="${rest%%_*}"
              arch="${rest#*_}"
              version="${version//\%3a/:}"
              if [[ "$base" =~ ^[a-z0-9][a-z0-9+.-]*_[A-Za-z0-9.+:~%-]+_[a-z0-9-]+$ ]]; then
                digest="$(sha256sum "$deb" | cut -d' ' -f1)"
                if { apt-cache show "$name:$arch=$version" || apt-cache show "$name=$version"; } 2>/dev/null | grep -qx "SHA256: $digest"; then
                  sudo cp "$deb" "$APT_ARCHIVES/"
                  continue
                fi
              fi
              echo "Not using the cached package $file: it does not match the package index"
              rm -f "$deb"
            done
          fi
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=10 600 "$(command -v node)" node_modules/@playwright/test/cli.js install-deps chromium webkit; then
              break
            fi
            echo "Playwright system dependencies attempt $attempt of 3 failed or timed out after 600 s"
            [ "$attempt" = 3 ] && exit 1
            # an apt that died mid-unpack leaves dpkg interrupted, and every retry would then fail; finish it first.
            # dpkg does not read apt's DPkg::Lock::Timeout, so if something holds the lock this fails at once and
            # `|| true` hides that; it is harmless, because the next apt attempt waits for the lock (up to 150 s).
            sudo dpkg --configure -a || true
          done
          # A miss keeps what this install downloaded: the .deb files that came into the archive directory after the
          # marker. They are chosen by inode change time, not modification time, because apt gives a downloaded file
          # the mirror's Last-Modified time, which is old. An empty directory is removed, so that nothing is saved for
          # the key (a saved key is never replaced). The save step below runs only for a push, manual or scheduled run;
          # here the files are only copied, which every run may do.
          if [ "$DEBS_HIT" != "true" ]; then
            mkdir -p "$HOME/apt-debs"
            sudo /usr/bin/find "$APT_ARCHIVES" -maxdepth 1 -type f -name '*.deb' -cnewer "$marker" -exec cp {} "$HOME/apt-debs/" \;
            rmdir "$HOME/apt-debs" 2>/dev/null || true
          fi
          rm -f "$marker"
          # The browser download is what hung until the job's time limit about eight times in two days, so it is the
          # part that keeps a short limit and a bounded number of attempts. It runs no apt and holds no lock.
          # This block ends the step (exit 0 or exit 1 inside it): add nothing after it without checking that.
          if [ "$CACHE_HIT" != "true" ]; then
            for attempt in 1 2 3; do
              if timeout --kill-after=10 240 corepack pnpm exec playwright install chromium webkit; then
                exit 0
              fi
              echo "Playwright browser download attempt $attempt of 3 failed or timed out after 240 s"
            done
            exit 1
          fi
      - name: Save Playwright system packages
        if: ${{ steps.apt-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-debs
          key: playwright-debs-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ steps.playwright-version.outputs.image }}
      - name: Save Playwright browsers
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: corepack pnpm test
      - run: corepack pnpm run build

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: node scripts/check-dependency-inventory.mjs --rust

  workflow-consistency:
    name: Workflow consistency
    runs-on: ubuntu-latest
    # Allow the full suite and setup to finish on slower runners while retaining
    # a bounded job timeout.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # check-protocol-section-numbers.mjs compares the reference against its
          # base to enforce never-renumber; a shallow clone has no base to read,
          # and the check says so and skips rather than passing quietly.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - run: node scripts/check-ci-workflow-consistency.mjs
      # A pull request that changes a pinned file, or the pin list, adds its own
      # acknowledgement file (docs/release-process.md). The step enforces: a missing,
      # wrong, edited or unneeded acknowledgement fails the job. A push to master checks
      # every landed commit the same way.
      - name: Check the surface acknowledgement
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          CHECK_MODE: ${{ github.event_name == 'pull_request' && 'pull_request' || github.event_name == 'merge_group' && 'merge_group' || github.event_name == 'push' && 'push' || 'workflow_dispatch' }}
        run: node scripts/check-surface-ack.mjs --mode "$CHECK_MODE"
      - run: node scripts/check-protocol-section-numbers.mjs
      - run: node scripts/check-protocol-section-numbers.test.mjs
      - run: node scripts/check-unbounded-reads.mjs
      - run: node scripts/check-gh-api-pagination.mjs
      - run: node --test scripts/prune-package-compiler-cache.test.mjs
      - run: node --test scripts/master-push-reuse.test.mjs scripts/master-push-scope.test.mjs
      - run: node --test scripts/check-ci-workflow-consistency.mutation.mjs
      # A committed merge-conflict marker passes every other check and ships as text.
      - run: node scripts/check-conflict-markers.mjs
      - run: node --test scripts/check-conflict-markers.test.mjs
      - run: node --test scripts/collect-macos-test-crashes.test.mjs scripts/retain-macos-test-binaries.test.mjs
      - run: node --test scripts/fetch-pdfium.test.mjs
      - run: node --test scripts/check-ai-attribution.test.mjs
      - run: python3 scripts/merge-gate.test.py
      - run: python3 scripts/surface_coverage_report.test.py

  tally-portable:
    name: Tally portable core
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target
          # bridge#669: a PR-scoped cache only serves that PR; PRs restore master's.
          save-if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
      - name: Test portable Tally truth layer
        working-directory: src-tauri
        run: >-
          cargo test --locked --no-fail-fast
          -p bridge-tally-core
          -p bridge-tally-protocol
          -p bridge-tally-transport
          -p tally-protocol-simulator
      - name: Lint portable Tally truth layer
        working-directory: src-tauri
        run: >-
          cargo clippy --locked
          -p bridge-tally-core
          -p bridge-tally-protocol
          -p bridge-tally-transport
          -p tally-protocol-simulator
          --all-targets -- -D warnings -A clippy::pedantic
      - name: Enforce Tally-path egress boundary
        run: node scripts/check-tally-egress-boundary.mjs
      - name: Enforce fixture byte integrity
        run: node scripts/check-fixture-byte-integrity.mjs
      - name: Enforce fixture provenance
        run: node scripts/check-fixture-provenance.mjs
      - name: Enforce Tally request-builder hazard allowlist
        run: node scripts/check-tally-request-builder-hazards.mjs

  native:
    name: Native checks (${{ matrix.os }}, shard ${{ matrix.shard }} of 2)
    needs: changes
    # Rust/Tauri changes always receive Windows coverage on PRs and in the merge queue; macOS runs these
    # tests on a push to master, on a scheduled or manual run and on a release pull request, the one that
    # changes the version (the scope job's native_os). The check is
    # deliberately skipped for frontend- and documentation-only PRs and for a draft PR, and a master push
    # runs it on macOS alone when the merge queue already ran it on Windows for that commit
    # (scripts/master-push-reuse.mjs).
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    # CI does not debug native test executables. Keep local line tables and
    # release profiles unchanged; assertions and overflow checks stay enabled.
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    # A cold Windows native build already consumed the former 35-minute budget
    # before the final isolated qualification test could complete. Keep a hard
    # bound, but reserve time for every required compile, test, and lint gate.
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.native_os) }}
        # The workspace tests are split in two halves by nextest's own partitioning (the test step below), each half on
        # its own runner. Each shard compiles the whole workspace for itself and the two share one Rust cache key, which
        # shard 1 alone saves (so a freshly saved cache holds no clippy-only dependency builds, and shard 2 may check those
        # once from cold). Shard 1 also runs the PDFium tests, the doctests and the tools tests; shard 2 also runs clippy,
        # the egress census and the tools lints. The matrix takes no include: or exclude: entries.
        # scripts/check-ci-workflow-consistency.mjs pins the list, the partition flag and each step's shard.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - name: Install pinned nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.143
          fallback: none
      - name: Set up Windows native prerequisites
        id: windows-native-prerequisites
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-native
        with:
          save-cache: ${{ matrix.shard == 1 }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: native-cache
        with:
          workspaces: |
            src-tauri -> target
          # Separate the Windows dependency artifacts from the former registry-only
          # cache. Keep Cargo/toolchain/profile fingerprints and cleanup defaults;
          # workspace binaries and incremental artifacts are not persisted.
          shared-key: ${{ runner.os == 'Windows' && format('native-deps-v1-{0}', hashFiles('.github/actions/setup-windows-native/action.yml')) || '' }}
          env-vars: ${{ runner.os == 'Windows' && 'ImageOS ImageVersion OPENSSL LIBCLANG' || '' }}
          # PRs consume trusted base caches. Manual branch runs can measure cold
          # and warm reuse in their own scope before a change reaches master.
          save-if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && matrix.shard == 1 }}
      - name: Record Windows prerequisite cache state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Windows native cache'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Dependency cache exact hit: `${{ steps.native-cache.outputs.cache-hit }}`'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Runner image: $env:ImageOS / $env:ImageVersion"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Strawberry Perl cache hit: `${{ steps.windows-native-prerequisites.outputs.cache-hit }}`'
      - name: Mark macOS test crash capture boundary
        id: native-crash-boundary
        if: runner.os == 'macOS'
        run: touch "$RUNNER_TEMP/bridge-native-start"
      - name: Test native workspace
        id: native-tests
        run: >-
          cargo nextest run --locked --manifest-path src-tauri/Cargo.toml
          --workspace --no-fail-fast --retries 0 --test-threads num-cpus --timings
          --partition count:${{ matrix.shard }}/2
      # Test names, binaries, times and outcomes from nextest's JUnit report (src-tauri/.config/nextest.toml),
      # for choosing which tests to trim or split. The report carries a failing test's panic text whatever
      # the store-*-output settings say, so it is uploaded only when the test step passed. It sits right after
      # that step because the PDFium step below runs nextest again and rewrites the same file.
      - name: Retain macOS per-test timings
        if: ${{ always() && runner.os == 'macOS' && steps.native-tests.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-test-timings-macos-shard-${{ matrix.shard }}
          path: src-tauri/target/nextest/default/junit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Collect minimized macOS test crash stacks
        if: ${{ always() && runner.os == 'macOS' && steps.native-crash-boundary.outcome == 'success' }}
        run: >-
          node scripts/collect-macos-test-crashes.mjs
          --since-file "$RUNNER_TEMP/bridge-native-start"
          --output "$RUNNER_TEMP/bridge-native-crashes.json"
          --wait-seconds ${{ steps.native-tests.outcome == 'failure' && '30' || '0' }}
      - name: Retain minimized macOS test crash stacks
        if: ${{ always() && runner.os == 'macOS' && steps.native-crash-boundary.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-crash-stacks-macos-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bridge-native-crashes.json
          if-no-files-found: error
          retention-days: 7
      - name: Link failed macOS test images to retained executables
        if: ${{ always() && runner.os == 'macOS' && steps.native-tests.outcome == 'failure' }}
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/retain-macos-test-binaries.mjs
          --crash-json "$RUNNER_TEMP/bridge-native-crashes.json"
          --target src-tauri/target/debug/deps
          --output "$RUNNER_TEMP/bridge-native-binaries"
      - name: Retain failed macOS executable evidence
        if: ${{ always() && runner.os == 'macOS' && steps.native-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-crash-binaries-macos-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/bridge-native-binaries
          if-no-files-found: error
          retention-days: 7
      # The statement parser loads PDFium, a native library. Its PDF tests are
      # #[ignore]d in the default run so a machine without the library still
      # passes; here the pinned build is fetched, verified against the SHA-256
      # in packaging/pdfium/pdfium.lock.json before extraction, and the ignored
      # tests are run on their own. Without the variable they fail, not skip.
      - name: Fetch pinned PDFium
        if: matrix.shard == 1
        shell: bash
        run: >-
          node scripts/fetch-pdfium.mjs
          --platform ${{ runner.os == 'Windows' && 'windows-x64' || 'macos-arm64' }}
          --dest "$RUNNER_TEMP/pdfium" --github-env "$GITHUB_ENV"
      # Nine tests, selected on the workspace build above and run on both systems: in
      # bridge-bank-statement's pdf_tests, a_union_bank_statement_reads_one_row_per_line,
      # an_owner_password_only_statement_opens_with_its_owner_password,
      # malformed_input_is_refused_not_parsed and
      # pdfium_reproduces_poppler_rows_on_the_synthetic_hdfc_statement; in the bridge lib,
      # a_parsed_statement_builds_an_import_file_by_proposals_id and four agent::bank_statement
      # tests (a_union_bank_statement_parses_without_printed_totals,
      # mask_parties_masks_every_name_in_the_summary,
      # only_the_summary_leaves_and_the_password_appears_nowhere,
      # refusals_name_a_category_and_a_row_never_the_statement). `--no-tests fail` makes a
      # filter that selects nothing fail the step, so a rename cannot silently turn the step
      # into a pass. A `-p` build resolves features differently from `--workspace`, so the
      # earlier `cargo test -p` pair recompiled six workspace crates (about 55 s on macOS)
      # to run them. One command also means a failure is the step's exit code: on Windows the
      # old pair ran under pwsh, which reports only the last command's status.
      - name: Test PDF extraction through PDFium
        if: matrix.shard == 1
        run: >-
          cargo nextest run --locked --manifest-path src-tauri/Cargo.toml
          --workspace --no-fail-fast --retries 0 --test-threads num-cpus --no-tests fail --run-ignored ignored-only
          -E 'package(=bridge-bank-statement) | (package(=bridge) & kind(lib) & (test(~bank_statement) | test(~a_parsed_statement_builds_an_import_file_by_proposals_id)))'
      # Nextest does not execute doctests. Keep these as a separate required step.
      # bridge#583: the test-only approval seam must be visible to the scan
      # that proves shipped binaries lack it. This reuses the unit-test build
      # above and fails if that executable does not hold the seam's marker.
      - name: Prove the approval-seam scan sees a test build
        shell: bash
        run: node scripts/check-no-test-seam.mjs --test-harness
      - name: Test native workspace doctests
        if: matrix.shard == 1
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --doc --no-fail-fast
      - name: Lint the native workspace
        if: matrix.shard == 2
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets --timings -- -D warnings -A clippy::pedantic
      # The Tally-path egress census (scripts/check-tally-egress-boundary.mjs, check 2). The
      # two egress lints are forced to warn, which no group allow, -A or lint table (measured)
      # can silence, over the shipped targets. The messages go to a file first, so a failed run
      # cannot read as "nothing found", and the census requires that what fired match the
      # reviewed call sites for this OS exactly, so a run that silences the lints (RUSTFLAGS
      # --cap-lints allow does) fails too. Measured with clippy 1.96.0 on macOS, on a two-file crate
      # and on this workspace: after a passing `-D warnings` step this run re-lints and reports the
      # firings. If it ever did not, the firings would be zero and the census would fail loudly. To
      # roll back, delete this step; the static half of the gate still runs in the portable job.
      - name: Census the Tally-path egress lints
        if: matrix.shard == 2
        shell: bash
        run: |
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --lib --bins --message-format=json -- -A clippy::pedantic --force-warn clippy::disallowed_methods --force-warn clippy::disallowed_types > "$RUNNER_TEMP/egress-census.jsonl"
          node scripts/check-tally-egress-boundary.mjs --census "$RUNNER_TEMP/egress-census.jsonl" "$RUNNER_OS"

      - name: Retain native compiler timings
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-compiler-timings-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: src-tauri/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7

  bundle-smoke:
    name: Bundle smoke (${{ matrix.os }})
    needs: changes
    # Bundle output is validated for packaging-relevant pull requests and for every
    # manual or scheduled run, and on a master push unless the merge queue already ran it
    # on that commit. A pull request runs Windows only. The macOS bundle and seam jobs run
    # in the merge queue and on a master push only when a packaging path changed (the
    # scope job's packaging_paths and bundle_os), so a macOS-only packaging failure is
    # found at the queue (it ejects that entry) and the nightly run covers everything else.
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.bundle_os) }}
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/bridge-package-sccache
      SCCACHE_CACHE_SIZE: 64M
      SCCACHE_LOCAL_RW_MODE: ${{ github.ref == 'refs/heads/master' && 'READ_WRITE' || 'READ_ONLY' }}
      # bridge#723: the default 600s idle shutdown can fire between the last
      # compile and the statistics step. `--show-stats` then reports zeroed
      # statistics with exit 0, and only `--stop-server` notices the server is
      # gone. Keep the server alive for the job, so a server missing at that
      # step means it crashed.
      SCCACHE_IDLE_TIMEOUT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - name: Match macOS cache inputs to the Tauri deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const target = config.bundle?.macOS?.minimumSystemVersion;
          if (typeof target !== 'string' || !/^\d+\.\d+(?:\.\d+)?$/.test(target)) {
            throw new Error('Expected an explicit macOS minimumSystemVersion in tauri.conf.json');
          }
          appendFileSync(process.env.GITHUB_ENV, `MACOSX_DEPLOYMENT_TARGET=${target}\n`);
          JS
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          # Tauri sets this inside its process; include it before cache lookup so
          # artifacts from a plain Cargo build cannot masquerade as a warm bundle.
          env-vars: ${{ runner.os == 'macOS' && 'MACOSX_DEPLOYMENT_TARGET' || '' }}
          save-if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
      - name: Set up Windows native prerequisites
        id: windows-bundle-prerequisites
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-native
      - name: Record Windows prerequisite cache state
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Windows native prerequisites'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Strawberry Perl cache hit: `${{ steps.windows-bundle-prerequisites.outputs.cache-hit }}`'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run license:all
      - name: Install pinned package compiler cache
        id: package-sccache
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: sccache@0.17.0
          fallback: none
      - name: Restore package compiler objects
        id: package-sccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: bridge-package-sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            bridge-package-sccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-
      - name: Start package compiler cache statistics
        id: package-sccache-start
        run: sccache --zero-stats
      - name: Use ad-hoc signing for macOS smoke bundles
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - run: corepack pnpm run tauri:build
        if: runner.os != 'macOS'
        env:
          CARGO_INCREMENTAL: '0'
          RUSTC_WORKSPACE_WRAPPER: sccache
      - name: Build macOS bundles with child diagnostics
        id: macos-bundle
        if: runner.os == 'macOS'
        env:
          CARGO_INCREMENTAL: '0'
          RUSTC_WORKSPACE_WRAPPER: sccache
          # Pinned Tauri CLI logs bundle_dmg.sh stdout/stderr only at debug.
          TAURI_CLI_VERBOSITY: '1'
        run: |
          node --test scripts/capture-package-log.test.mjs
          set -o pipefail
          corepack pnpm run tauri:build -- --timings 2>&1 | node scripts/capture-package-log.mjs
      - name: Collect failed macOS bundle context
        if: ${{ failure() && runner.os == 'macOS' && steps.macos-bundle.outcome == 'failure' }}
        run: |
          mkdir -p package-diagnostics
          hdiutil info > package-diagnostics/disk-images.txt 2>&1
          df -h . > package-diagnostics/disk-space.txt 2>&1
      - name: Retain macOS package diagnostics
        if: ${{ always() && runner.os == 'macOS' && (steps.macos-bundle.outcome == 'success' || steps.macos-bundle.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-package-diagnostics
          path: |
            package-diagnostics/**
            src-tauri/target/release/bundle/dmg/bundle_dmg.sh
            src-tauri/target/cargo-timings/*.html
          if-no-files-found: warn
          retention-days: 7
      - name: Verify Windows installer legal resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-windows-bundle-resources.ps1
      - name: Verify macOS app legal resources and signature
        if: runner.os == 'macOS'
        run: |
          node scripts/check-macos-bundle-resources.mjs
          node scripts/check-macos-bundle-resources.mutation.mjs
      # parse_bank_statement loads PDFium from beside bridge_mcp, so the bundle
      # carries the pinned build. fetch-pdfium.mjs verifies the archive, the
      # library and the licence notice it writes against the lock before use.
      - name: Fetch pinned PDFium for the MCPB
        shell: bash
        run: >-
          node scripts/fetch-pdfium.mjs
          --platform ${{ runner.os == 'Windows' && 'windows-x64' || 'macos-arm64' }}
          --dest "$RUNNER_TEMP/mcpb-pdfium"
      # tauri build uses --bins, including the auto-discovered bridge_mcp.
      # Stage that fresh release binary instead of rebuilding without Tauri's
      # custom-protocol feature and native build environment.
      # bridge#583: no shipped executable may hold the test-only approval seam.
      # tauri build already ran this as its beforeBundleCommand; it is repeated
      # here on the exact files uploaded. The positive control, that the
      # optimiser keeps the marker in a release build, is the seam-control job.
      - name: Prove shipped executables lack the test-only approval seam
        shell: bash
        run: |
          set -euo pipefail
          ext="${{ runner.os == 'Windows' && '.exe' || '' }}"
          node scripts/check-no-test-seam.mjs "src-tauri/target/release/bridge$ext" "src-tauri/target/release/bridge_mcp$ext"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            node scripts/check-no-test-seam.mjs src-tauri/target/release/bundle/macos
          fi
      - name: Stage host MCPB binary, PDFium and legal resources
        shell: bash
        run: >-
          node scripts/package-mcpb.mjs
          --binary src-tauri/target/release/bridge_mcp${{ runner.os == 'Windows' && '.exe' || '' }}
          --pdfium "$RUNNER_TEMP/mcpb-pdfium"
      - name: Validate and pack MCPB with the official schema
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate packaging/mcpb/stage/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack packaging/mcpb/stage src-tauri/target/release/bundle/bridge-tally.mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 info src-tauri/target/release/bundle/bridge-tally.mcpb
      - name: Exercise the packaged MCPB stdio server
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_command=python
          else
            python_command=python3
          fi
          "$python_command" scripts/check-mcpb-bundle.test.py
          "$python_command" scripts/check-mcpb-bundle.py src-tauri/target/release/bundle/bridge-tally.mcpb --output src-tauri/target/release/bundle/mcpb-smoke.json
          # bridge#1810: the Rust port runs the same checks on the same bundle, and its report must equal the
          # Python's byte for byte before the Python is retired. It is written outside the uploaded folder.
          cargo run --locked --release --manifest-path src-tauri/Cargo.toml --example check_mcpb_bundle -- src-tauri/target/release/bundle/bridge-tally.mcpb --output "$RUNNER_TEMP/mcpb-smoke-rust.json"
          if ! cmp src-tauri/target/release/bundle/mcpb-smoke.json "$RUNNER_TEMP/mcpb-smoke-rust.json"; then
            diff src-tauri/target/release/bundle/mcpb-smoke.json "$RUNNER_TEMP/mcpb-smoke-rust.json" || true
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-bundle-smoke-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
      - name: Retain package compiler cache statistics
        id: package-sccache-stats
        if: ${{ always() && steps.package-sccache-start.outcome == 'success' }}
        shell: bash
        # --stop-server stays strict: it is the only proof that --show-stats
        # read the live server rather than inventing zeroed statistics.
        run: |
          sccache --show-stats --stats-format json > package-compiler-cache.json
          sccache --stop-server
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const writes = JSON.parse(readFileSync('package-compiler-cache.json', 'utf8')).stats.cache_writes;
          if (!Number.isSafeInteger(writes) || writes < 0) throw new Error('Invalid compiler-cache write count');
          appendFileSync(process.env.GITHUB_OUTPUT, `has-writes=${writes > 0}\n`);
          JS
      - name: Upload package compiler cache statistics
        if: ${{ always() && steps.package-sccache-start.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-compiler-cache-${{ matrix.os }}
          path: package-compiler-cache.json
          if-no-files-found: error
          retention-days: 7
      - name: Save qualified master compiler objects
        if: ${{ success() && github.ref == 'refs/heads/master' && steps.package-sccache-stats.outputs.has-writes == 'true' && steps.package-sccache-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ steps.package-sccache-cache.outputs.cache-primary-key }}

  seam-control:
    name: Seam positive control (${{ matrix.os }})
    needs: changes
    # The release-profile half of bundle-smoke's seam proof, run beside it
    # rather than after it: it builds the bridge lib unit-test executable in
    # release and requires the marker there, so a clean scan of the shipped
    # executables means the scan could have seen the seam. Same scope and
    # platforms as bundle-smoke, whose runs it guards (the scope job's bundle_os).
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.bundle_os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - name: Match macOS cache inputs to the Tauri deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const target = config.bundle?.macOS?.minimumSystemVersion;
          if (typeof target !== 'string' || !/^\d+\.\d+(?:\.\d+)?$/.test(target)) {
            throw new Error('Expected an explicit macOS minimumSystemVersion in tauri.conf.json');
          }
          appendFileSync(process.env.GITHUB_ENV, `MACOSX_DEPLOYMENT_TARGET=${target}\n`);
          JS
      # Restores bundle-smoke's release dependencies (same key) and never saves:
      # a second cache family would only compete for the repository's quota.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: bundle-smoke
          env-vars: ${{ runner.os == 'macOS' && 'MACOSX_DEPLOYMENT_TARGET' || '' }}
          save-if: false
      - name: Set up Windows native prerequisites
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-native
      - name: Prove the seam scan sees a release test build
        shell: bash
        run: node scripts/check-no-test-seam.mjs --test-harness --release

  compiler-cache-retention:
    name: Retain current compiler caches
    # Every job that saves a Rust cache has finished, so no save races the listing.
    needs: [bundle-smoke, native, tally-portable, workflow-consistency]
    # Not on the scheduled run: the pruner admits only a master push or a manual run.
    if: ${{ always() && github.ref == 'refs/heads/master' && github.event_name != 'schedule' && needs.workflow-consistency.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    # Master runs can overlap (a push and the daily run), and prunes must not run at once. queue: max keeps every
    # waiting prune instead of cancelling the older one, so a cancelled prune
    # means a real cancellation or a timeout, and required-checks fails on it.
    concurrency:
      group: package-compiler-cache-retention
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      # Package sccache: two newest per OS. Rust caches: newest per job/OS family.
      - name: Prune only obsolete master compiler caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prune-package-compiler-cache.mjs --apply

  tax-audit-mutations:
    name: Tax-audit mutation records
    # No build: this checks the committed results file, never re-runs a mutation.
    # parity/mutations.mjs's header comment states the guarantee it enforces. Required,
    # but only on a pull request that touches the crate (or this workflow): a
    # master left inconsistent by a merge that bypassed it then reds crate PRs and
    # the nightly run, not every unrelated PR.
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.tax_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - name: Test the mutation runner
        run: node --test src-tauri/crates/bridge-tax-audit/parity/mutations.test.mjs
      # The nightly run writes the ids it found failing into its open tracking issue.
      - name: Read any open nightly mutation issue
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --label mutation-nightly --state open --limit 100 \
            --json number,body --jq '.[] | "<!-- mutation-nightly-issue \(.number) -->\n\(.body)\n"' \
            > "$RUNNER_TEMP/nightly-issues.txt"
      # Every mutation applies exactly once, no record outlives its mutation, and every
      # mutation this change selects has a killed record made on exactly this merged
      # crate tree. While a nightly issue is open, a crate change must also re-prove
      # every mutation it lists as failing, so the fix merges and nothing else does.
      - name: Check the change's mutations are proven on this tree
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: >-
          node src-tauri/crates/bridge-tax-audit/parity/mutations.mjs --verify
          --changed-since "$BASE_SHA" --nightly-issues "$RUNNER_TEMP/nightly-issues.txt"

  required-checks:
    # A draft-scoped run posts `Required checks (draft)`, which no ruleset requires, never `Required checks`: its
    # green means the heavy jobs were skipped on purpose, and must not stand in for the ready run's gate on the same
    # head. The ready run, the merge queue's run and every other event post `Required checks`.
    name: ${{ needs.changes.outputs.draft == 'true' && 'Required checks (draft)' || 'Required checks' }}
    # Always runs so it can report a single, stable required status for branch
    # protection. Point branch protection at this context instead of the
    # individual matrix jobs, which report `skipped` when they are not selected.
    # Each job it needs has one rule below. A job with no condition must succeed.
    # native, bundle-smoke, seam-control and tax-audit-mutations run exactly when
    # the scope job's output for them is 'true' (a draft pull request, a change
    # outside their paths and a reused master push set it 'false'): each must
    # succeed then and be skipped otherwise, so a job that should have run and
    # did not fails this job. compiler-cache-retention runs on master only and
    # may be skipped. A failure or cancellation fails every rule.
    if: ${{ always() }}
    needs: [changes, frontend, rust-format, workflow-consistency, tally-portable, native, bundle-smoke, seam-control, compiler-cache-retention, tax-audit-mutations]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Only to read whether a draft-scoped run's pull request is still a draft.
      pull-requests: read
    steps:
      - name: Verify every job that should have run passed
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON"
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          // A rule is one of three kinds: { kind: 'always' }, { kind: 'scope', output } or { kind: 'optional' }.
          const rules = new Map([
            ['changes', { kind: 'always' }],
            ['frontend', { kind: 'always' }],
            ['rust-format', { kind: 'always' }],
            ['workflow-consistency', { kind: 'always' }],
            ['tally-portable', { kind: 'always' }],
            ['native', { kind: 'scope', output: 'native' }],
            ['bundle-smoke', { kind: 'scope', output: 'bundle' }],
            ['seam-control', { kind: 'scope', output: 'bundle' }],
            ['tax-audit-mutations', { kind: 'scope', output: 'tax_audit' }],
            ['compiler-cache-retention', { kind: 'optional' }],
          ]);
          const RESULTS = new Set(['success', 'failure', 'cancelled', 'skipped']);
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const scope = needs.changes?.outputs ?? {};
          const problems = [];
          // A draft-scoped run skipped the heavy jobs because its pull request was a draft when the scope job ran. It
          // passes only while the pull request still is one, read again here: re-running the failed jobs of an old draft
          // run after the ready click re-runs this job but not the scope job, and must not turn this job green.
          if (scope.draft === 'true') {
            let live = 'unreadable';
            try {
              live = execFileSync('gh', ['api', `repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}`, '--jq', '.draft'], { encoding: 'utf8' }).trim();
            } catch { /* an unreadable pull request is not a draft */ }
            console.log(`draft-scoped run; the pull request is a draft now: ${live}`);
            if (live !== 'true') problems.push(`draft-scoped run, but the pull request is not a draft now (${JSON.stringify(live)}): its heavy jobs were skipped, so use the run of the ready state`);
          } else if (scope.draft !== 'false') {
            problems.push(`scope output draft is ${JSON.stringify(scope.draft)}, neither 'true' nor 'false'`);
          }
          // What this job requires of each result: the set of results that pass, or a reason it cannot judge.
          function expected(rule) {
            if (rule.kind === 'always') return { pass: ['success'] };
            if (rule.kind === 'optional') return { pass: ['success', 'skipped'] };
            if (rule.kind !== 'scope') return { error: `rule kind ${JSON.stringify(rule.kind)} is unknown` };
            const selected = scope[rule.output];
            if (selected === 'true') return { pass: ['success'] };
            if (selected === 'false') return { pass: ['skipped'] };
            return { error: `scope output ${rule.output} is ${JSON.stringify(selected)}, neither 'true' nor 'false'` };
          }
          for (const job of [...new Set([...Object.keys(needs), ...rules.keys()])].sort()) {
            const result = Object.hasOwn(needs, job) ? needs[job]?.result : undefined;
            const rule = rules.get(job);
            if (!rule) { problems.push(`${job}: no rule says whether it must run`); continue; }
            if (!RESULTS.has(result)) { problems.push(`${job}: result ${JSON.stringify(result)} is not one of GitHub's four`); continue; }
            const want = expected(rule);
            if (want.error) { problems.push(`${job}: ${want.error}`); continue; }
            console.log(`${job}: ${result} (passes as ${want.pass.join(' or ')})`);
            if (!want.pass.includes(result)) problems.push(`${job}: ${result}, required ${want.pass.join(' or ')}`);
          }
          if (problems.length) {
            console.log(`Required jobs did not pass:\n${problems.join('\n')}`);
            process.exit(1);
          }
          console.log('Every job that should have run passed, and every skipped job was not selected.');
          JS
