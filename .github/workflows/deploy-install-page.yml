name: Deploy Bridge install page

on:
  workflow_dispatch:
  # A successful preview publication redeploys the page, so its release snapshot is never a
  # release behind. GITHUB_TOKEN-created releases start no workflow of their own. The trigger
  # matches a workflow by name, so the job also requires a manual run from this repository.
  workflow_run:
    workflows: ["Publish MCPB preview release"]
    types: [completed]

# The workflow holds read access only. The Pages and identity-token permissions belong to the deploy
# job alone, which runs the two Pages actions and nothing else; the build job runs this repository's
# scripts and holds neither.
permissions:
  contents: read

concurrency:
  group: bridge-install-page
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The install page reads this snapshot when the unauthenticated GitHub API refuses it
      # (60 requests an hour per address). A failed or empty read stops the deploy rather than
      # publishing a list that says no release exists.
      - name: Snapshot releases for the install page
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --paginate reads every page; --jq then prints one release per line, and jq -s collects them.
          gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | {tag_name, draft, prerelease, published_at, assets: [.assets[] | {name, browser_download_url}]}' \
            | jq -s . > site/releases.json
          # Counted with the page's own predicate, so the deploy and the page agree on what installs.
          count="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { isInstallablePreview } from "./site/release-catalog.mjs"; console.log(JSON.parse(readFileSync("site/releases.json", "utf8")).filter(isInstallablePreview).length);')"
          if [ "${count}" -lt 1 ]; then
            echo "release snapshot has no installable release; refusing to deploy" >&2
            exit 1
          fi
          echo "release snapshot: ${count} installable releases"
      # The changelog page is rendered from CHANGELOG.md, the file the release notes come from. A
      # failure writes a page that links to the releases; it never stops the deploy.
      - name: Render the changelog page
        run: node scripts/release-notes.mjs page --changelog CHANGELOG.md --template site/changelog.template.html --out site/changelog.html
      # The Privacy Policy and the Terms of Use are rendered from docs/legal/. Unlike the changelog there
      # is no fallback page: text the renderer does not support, or an unresolved marker, stops the deploy.
      - name: Render the privacy policy and the terms of use
        run: |
          set -euo pipefail
          node scripts/render-legal.mjs page --in docs/legal/privacy.md --template site/legal.template.html --out site/privacy.html
          node scripts/render-legal.mjs page --in docs/legal/terms.md --template site/legal.template.html --out site/terms.html
      # The page text is a public claim, and a deploy publishes every merged site/ change at once.
      # This lists what differs from the last successfully deployed commit in the run summary so a
      # maintainer can read it. This run's own deployment is created by the deploy job, after this one,
      # and a failed deployment never went live, so only a finished successful deployment of another
      # commit counts. It only informs: a failure or timeout here warns and never stops the deploy.
      - name: Summarize site changes since the last deploy
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Newest first. --paginate reads every page, so the last successful deployment is found
          # however many failed or repeated ones sit above it.
          candidates="$(gh api --paginate "repos/${REPOSITORY}/deployments?environment=github-pages&per_page=100" --jq '.[] | [.id, .sha] | @tsv')"
          previous=""
          while read -r id sha; do
            [ -n "${id}" ] && [ "${sha}" != "${GITHUB_SHA}" ] || continue
            # Statuses are newest first; sed reads them all, so the first line is the latest state.
            state="$(gh api --paginate "repos/${REPOSITORY}/deployments/${id}/statuses?per_page=100" --jq '.[].state' | sed -n 1p)"
            if [ "${state}" = "success" ]; then previous="${sha}"; break; fi
          done <<< "${candidates}"
          {
            echo "### Site text changed since the last deploy"
            echo
            if [ -z "${previous}" ]; then
              echo "No earlier successful deployment of another commit was found, so there is nothing to compare."
            elif ! git fetch --quiet --depth=1 origin "${previous}"; then
              echo "The last deployed commit ${previous:0:12} could not be fetched, so nothing was compared."
            elif git diff --quiet "${previous}" HEAD -- site/; then
              echo "Nothing under \`site/\` differs from ${previous:0:12}."
            else
              echo "Compared with the last deployed commit ${previous:0:12}. Files generated during the deploy, such as the release list and the changelog page, are not compared."
              echo
              git diff --stat "${previous}" HEAD -- site/
              echo
              echo "Read these lines; site text is a public claim (docs/release-process.md)."
              echo
              echo '~~~~diff'
              git diff --unified=1 "${previous}" HEAD -- site/ > "${RUNNER_TEMP}/site.diff"
              head -n 300 "${RUNNER_TEMP}/site.diff" | cut -c1-400
              echo '~~~~'
              if [ "$(wc -l < "${RUNNER_TEMP}/site.diff")" -gt 300 ]; then
                echo "The diff is cut at 300 lines of 400 characters; run \`git diff ${previous:0:12} HEAD -- site/\` for the rest."
              fi
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
