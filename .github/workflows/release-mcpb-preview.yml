name: Publish MCPB preview release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable preview tag, for example mcp-preview-0.2.1"
        required: true
        type: string

concurrency:
  group: mcpb-preview-release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-admission:
    name: Admit immutable preview tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - name: Require reviewed source and a matching immutable preview version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          node scripts/check-mcpb-preview-admission.mjs "$RELEASE_TAG" "$SOURCE_REF" "$DEFAULT_BRANCH"

  package:
    name: Package ${{ matrix.platform }}
    needs: release-admission
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            binary: bridge_mcp.exe
            architecture: x86_64
          - os: macos-14
            platform: macos-arm64
            binary: bridge_mcp
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      - name: Set up Windows native prerequisites
        id: windows-mcpb-prerequisites
        if: runner.os == 'Windows'
        uses: ./.github/actions/setup-windows-native
      - name: Verify the runner architecture before packaging
        shell: bash
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          test "$actual" = "$EXPECTED_ARCHITECTURE"
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run license:all
      - name: Build the host Bridge MCP binary
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin bridge_mcp
      - name: Fetch the pinned PDFium build
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then python_command=python; else python_command=python3; fi
          "$python_command" scripts/fetch-pdfium.py --platform "$PLATFORM" --dest "$RUNNER_TEMP/mcpb-pdfium"
      # bridge#583: the released binary must not hold the test-only approval
      # seam. package-mcpb.mjs refuses it as well; this names the exact file.
      - name: Prove the release binary lacks the test-only approval seam
        shell: bash
        run: node scripts/check-no-test-seam.mjs src-tauri/target/release/${{ matrix.binary }}
      - name: Stage the reviewed release binary, PDFium and legal resources
        shell: bash
        run: >-
          node scripts/package-mcpb.mjs
          --binary src-tauri/target/release/${{ matrix.binary }}
          --pdfium "$RUNNER_TEMP/mcpb-pdfium"
      - name: Validate, archive, and exercise the real MCPB
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          asset="bridge-tally-${RELEASE_TAG}-${PLATFORM}.mcpb"
          npx --yes @anthropic-ai/mcpb@2.1.2 validate packaging/mcpb/stage/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack packaging/mcpb/stage "release-assets/$asset"
          if [[ "$RUNNER_OS" == "Windows" ]]; then python_command=python; else python_command=python3; fi
          "$python_command" scripts/check-mcpb-bundle.test.py
          "$python_command" scripts/check-mcpb-bundle.py "release-assets/$asset" --output "release-assets/$asset.smoke.json"
          node scripts/write-mcpb-release-metadata.mjs "release-assets/$asset" "$RELEASE_TAG" "$PLATFORM" "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-preview-${{ matrix.platform }}
          path: release-assets/**
          if-no-files-found: error
          retention-days: 1

  # The only job that can mint an identity token. It runs no repository code and installs nothing:
  # it downloads the two archives the package jobs built, checks each against the digest the
  # package job wrote beside it, and attests them. The package jobs, which run dependency build
  # scripts, hold contents: read only. The digest check catches a mismatched or damaged download,
  # not a package job that wrote a matching set; the attestation vouches for this run's output
  # (which workflow run and commit produced these bytes), not for what the archive contains. It is
  # not a code signature, no client checks it yet, and it does not show the code is safe.
  attest:
    name: Attest the built archives
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mcpb-preview-*
          path: release-assets
          merge-multiple: true
      - name: Check each archive against the digest its package job recorded
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for platform in windows-x64 macos-arm64; do
            asset="release-assets/bridge-tally-${RELEASE_TAG}-${platform}.mcpb"
            test -f "$asset"
            actual="$(sha256sum "$asset" | cut -d' ' -f1)"
            listed="$(cut -d' ' -f1 "$asset.sha256")"
            recorded="$(jq -r .sha256 "$asset.provenance.json")"
            source_sha="$(jq -r .source_sha "$asset.provenance.json")"
            if [[ "$actual" != "$listed" || "$actual" != "$recorded" ]]; then
              echo "digest mismatch for $asset: file $actual, .sha256 $listed, provenance $recorded"
              exit 1
            fi
            if [[ "$source_sha" != "$GITHUB_SHA" ]]; then
              echo "provenance names commit $source_sha, not this run's $GITHUB_SHA"
              exit 1
            fi
          done
      - name: Attest where these archives were built
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/bridge-tally-${{ inputs.release_tag }}-windows-x64.mcpb
            release-assets/bridge-tally-${{ inputs.release_tag }}-macos-arm64.mcpb

  publish-preview:
    name: Publish durable unsigned preview assets
    needs: [package, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mcpb-preview-*
          path: release-assets
          merge-multiple: true
      - name: Require both platform archives and their release evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for platform in windows-x64 macos-arm64; do
            asset="release-assets/bridge-tally-${RELEASE_TAG}-${platform}.mcpb"
            test -f "$asset"
            test -f "$asset.sha256"
            test -f "$asset.provenance.json"
            test -f "$asset.smoke.json"
          done
      # The archives crossed an artifact upload and download between jobs. Check the downloaded bytes
      # against the attestation the attest job signed for them, requiring this workflow, this
      # commit, the default branch and a GitHub-hosted runner, before anything is published.
      - name: Verify each archive against its build attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          for platform in windows-x64 macos-arm64; do
            asset="release-assets/bridge-tally-${RELEASE_TAG}-${platform}.mcpb"
            gh attestation verify "$asset" --repo "$REPOSITORY" --signer-workflow "$REPOSITORY/.github/workflows/release-mcpb-preview.yml" --source-digest "$SOURCE_SHA" --source-ref "refs/heads/$DEFAULT_BRANCH" --deny-self-hosted-runners
          done
      # The notes come from CHANGELOG.md, the file the install page's changelog also renders. A
      # missing or unreadable section never stops the release: it warns and publishes the standard
      # unsigned-preview text alone.
      - name: Compose the release notes from CHANGELOG.md
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          footer=packaging/mcpb/UNSIGNED_PREVIEW_RELEASE.md
          notes="$RUNNER_TEMP/release-notes.md"
          if ! node scripts/release-notes.mjs notes --tag "$RELEASE_TAG" --changelog CHANGELOG.md --footer "$footer" --out "$notes"; then
            echo "::warning::could not compose release notes from CHANGELOG.md; publishing the standard unsigned-preview text only"
            cp "$footer" "$notes"
          fi
      - name: Create the immutable GitHub preview release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "refusing to replace existing release assets for $RELEASE_TAG"
            exit 1
          fi

          resolve_preview_tag_commit() {
            local tag_ref_file tag_sha peeled_sha ref_sha ref
            tag_ref_file="$(mktemp)"
            if ! git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" >"$tag_ref_file"; then
              rm -f "$tag_ref_file"
              return 1
            fi
            tag_sha=""
            peeled_sha=""
            while IFS=$'\t' read -r ref_sha ref; do
              case "$ref" in
                "refs/tags/$RELEASE_TAG") tag_sha="$ref_sha" ;;
                "refs/tags/$RELEASE_TAG^{}") peeled_sha="$ref_sha" ;;
              esac
            done <"$tag_ref_file"
            rm -f "$tag_ref_file"
            printf '%s' "${peeled_sha:-$tag_sha}"
          }

          if ! existing_tag_commit="$(resolve_preview_tag_commit)"; then
            echo "could not verify whether $RELEASE_TAG already exists; refusing to publish"
            exit 1
          fi
          if [[ -n "$existing_tag_commit" ]]; then
            if [[ "$existing_tag_commit" != "$SOURCE_SHA" ]]; then
              echo "refusing to publish: existing tag $RELEASE_TAG does not identify $SOURCE_SHA"
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$SOURCE_SHA" >/dev/null
          fi

          if ! verified_tag_commit="$(resolve_preview_tag_commit)"; then
            echo "could not verify the tag created for $RELEASE_TAG; refusing to publish"
            exit 1
          fi
          if [[ "$verified_tag_commit" != "$SOURCE_SHA" ]]; then
            echo "refusing to publish: $RELEASE_TAG does not identify $SOURCE_SHA"
            exit 1
          fi

          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "Bridge MCPB unsigned preview: $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
      # GitHub's grouped change list (.github/release.yml) goes under the written notes. It is added
      # after the release exists, so a failure here leaves a complete release and only a warning.
      - name: Append GitHub's generated change list
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -uo pipefail
          combined="$RUNNER_TEMP/release-notes-combined.md"
          if generated="$(gh api --method POST "repos/$GH_REPO/releases/generate-notes" -f "tag_name=$RELEASE_TAG" --jq .body)" \
            && [ -n "$generated" ] \
            && { cat "$RUNNER_TEMP/release-notes.md" && printf '\n---\n\n%s\n' "$generated"; } >"$combined" \
            && gh release edit "$RELEASE_TAG" --notes-file "$combined"; then
            echo "appended GitHub's generated change list to $RELEASE_TAG"
          else
            echo "::warning::could not append GitHub's generated change list to $RELEASE_TAG; the release keeps its written notes"
          fi
