name: macOS crash capture control

on:
  workflow_dispatch:

jobs:
  capture-control:
    name: Capture a disposable hosted process crash
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test collector parsing and bounded collection
        run: node --test scripts/collect-macos-test-crashes.test.mjs scripts/retain-macos-test-binaries.test.mjs
      - name: Generate one disposable control report
        shell: bash
        run: |
          set -euo pipefail
          printf '#include <signal.h>\nint main(void) { return raise(SIGTRAP); }\n' > "$RUNNER_TEMP/crash-control.c"
          clang "$RUNNER_TEMP/crash-control.c" -o "$RUNNER_TEMP/bridge_lib-cafe"
          touch "$RUNNER_TEMP/control-start"
          status=0
          "$RUNNER_TEMP/bridge_lib-cafe" || status=$?
          # 128 + SIGTRAP (5): the control must have died by the signal, not exited.
          test "$status" -eq 133 || { echo "control did not exit with SIGTRAP (status $status)"; exit 1; }
      - name: Capture and verify the control stack
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collect-macos-test-crashes.mjs --since-file "$RUNNER_TEMP/control-start" --output "$RUNNER_TEMP/control-crash.json" --wait-seconds 30
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { join } from "node:path";
          const result = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, "control-crash.json"), "utf8"));
          assert.equal(result.status, "captured", "hosted crash report was not captured");
          assert.ok(
            result.reports.some((report) => report.process === "bridge_lib-cafe" && report.exception.signal === "SIGTRAP" && report.threads.length > 0),
          );
          JS
      - name: Verify matching executable retention and mismatch refusal
        shell: bash
        run: |
          set -euo pipefail
          node scripts/retain-macos-test-binaries.mjs --crash-json "$RUNNER_TEMP/control-crash.json" --target "$RUNNER_TEMP" --output "$RUNNER_TEMP/control-binaries"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { execFileSync, spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { mkdirSync, readdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const root = process.env.RUNNER_TEMP;
          const result = JSON.parse(readFileSync(join(root, "control-binaries/manifest.json"), "utf8"));
          assert.ok(result.status === "linked" && result.binaries.length === 1);
          const binary = result.binaries[0];
          const staged = readFileSync(join(root, "control-binaries", binary.file));
          assert.ok(staged.equals(readFileSync(join(root, "bridge_lib-cafe"))));
          assert.equal(createHash("sha256").update(staged).digest("hex"), binary.sha256);
          assert.equal(result.provenance.checkout_sha, execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim());
          // Compile a different owned image; it is never executed or crashed.
          const mismatch = join(root, "mismatch");
          mkdirSync(mismatch);
          writeFileSync(join(mismatch, "other.c"), "int main(void) { return 0; }\n");
          execFileSync("clang", [join(mismatch, "other.c"), "-o", join(mismatch, "bridge_lib-cafe")]);
          const refused = spawnSync("node", ["scripts/retain-macos-test-binaries.mjs", "--crash-json", join(root, "control-crash.json"), "--target", mismatch, "--output", join(root, "mismatch-evidence")], { stdio: "inherit" });
          assert.equal(refused.status, 1);
          const rejected = JSON.parse(readFileSync(join(root, "mismatch-evidence/manifest.json"), "utf8"));
          assert.deepEqual(rejected.errors, ["image_identity_mismatch"]);
          assert.deepEqual(rejected.binaries, []);
          assert.deepEqual(readdirSync(join(root, "mismatch-evidence")), ["manifest.json"]);
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: hosted-crash-capture-control
          path: |
            ${{ runner.temp }}/control-crash.json
            ${{ runner.temp }}/control-binaries
            ${{ runner.temp }}/mismatch-evidence
          if-no-files-found: error
          retention-days: 7
