name: Tax-audit mutations (nightly)

# The bridge-tax-audit crate records every mutation written against it in
# parity/mutations.json. A pull request re-proves only the mutations its change
# selects (parity/mutations.mjs --verify, in ci.yml). This run re-proves the
# WHOLE list against the FULL suite on master, so a mutation whose killing tests
# were weakened by a change elsewhere in the crate is caught within a day. Any
# mutation not killed, not run, or with a stale committed record fails the run
# and opens (or updates) one tracking issue labelled `mutation-nightly`, whose body
# carries a line naming the failing ids. While that issue is open, ci.yml's
# mutation check requires a crate pull request to re-prove those ids on its merged
# tree: the fix can merge, and nothing else in the crate can.
on:
  schedule:
    - cron: "23 21 * * *" # daily, off the hour
  workflow_dispatch:
    inputs:
      mode:
        # full: every mutation against the full suite (finds new killers). proof: each
        # mutation with a committed killed record runs those killers first, and the full suite
        # only when they do not kill it; every kill is still seen on this exact tree, after the
        # full suite passed unmutated on it, which is all a pull request's records need, and
        # every other verdict comes from the full suite. Master's runs are always full.
        description: "full, or proof (a pull request head's records)"
        type: choice
        options: [full, proof]
        default: full

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: the report job writes to an issue in two steps, and a
  # cancelled half-run would leave it half-updated.
  # One group for every ref: runs go one at a time, so a run's eight shards never
  # compete with another run's for runners that pull requests' CI also needs.
  # queue: max keeps up to 100 waiting runs, roughly first in, first out; the
  # default keeps only the newest, so a second branch's dispatch silently
  # cancelled the first's.
  group: tax-audit-mutations-nightly
  cancel-in-progress: false
  queue: max

jobs:
  shard:
    name: Mutations, shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # A shard runs 1 to 2 hours. Eight at once would hold 8 of the 20 runner slots the whole
      # account shares (a pull request's checks wait behind them); four at a time takes two
      # waves, the same job-minutes, a longer wall time.
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.96.0
      # The locked crates are fetched here, in a step of their own, and not during the build of the
      # unmutated copy: a download that failed there refused the shard, opened the tracking issue
      # and held every crate pull request until someone re-ran the night (4 of the nightly's 6 failures
      # in the window read for the issue were fetch errors). A network failure is retried (3 attempts
      # at most, 30 s then 60 s apart); a failure that is not a network failure ends the step at once;
      # a network failure that persists ends it after the third attempt. A crate the registry reports
      # missing (cargo's own text for a 404 or 410 on a download, or no such package in the index: a
      # permanent answer) ends it at once too, and each attempt is cut off after
      # 15 minutes (a timeout is retried like a network failure), so a stalled download cannot hold a runner
      # for the job's whole limit. Either way the step fails
      # with the named error below and a typed refusal in place of results, so the report says
      # "dependency fetch failed", not a mutation result. `cargo fetch` cannot be limited to one
      # package: it downloads the whole workspace's locked crates (about 560 registry packages against
      # about 120 in the records crate's own closure), so a failure on a crate this shard never builds
      # can now refuse it; the retry bounds that, and the crates are then in the runner's cache.
      - name: Fetch the locked crates, retrying a network failure
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set +e
          attempts=3
          fetch_timeout="${FETCH_TIMEOUT:-15m}"
          log="$RUNNER_TEMP/fetch.log"
          attempt=1
          while true; do
            timeout --kill-after=30s "$fetch_timeout" cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "dependency-fetch: attempt $attempt/$attempts outcome=ok"
              exit 0
            fi
            kind=other
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              kind=timeout
            elif grep -Eq 'successful HTTP response from .* got (404|410)([^0-9]|$)|no matching package named' "$log"; then
              kind=missing
            elif grep -Eq 'curl failed|spurious network error|download of .* failed|unable to update registry|failed to download|Could not resolve host|Couldn.t connect|Operation timed out|Connection (reset|refused)|SSL_ERROR|returned error: 5[0-9][0-9]' "$log"; then
              kind=network
            fi
            if [ "$kind" = other ]; then
              echo "dependency-fetch: attempt $attempt/$attempts outcome=other-failure (not a network failure), not retrying"
              break
            fi
            if [ "$kind" = missing ]; then
              echo "dependency-fetch: attempt $attempt/$attempts outcome=missing-crate (the registry answered not found, a permanent answer), not retrying"
              break
            fi
            label=network-failure
            if [ "$kind" = timeout ]; then label="timeout after $fetch_timeout"; fi
            if [ "$attempt" -ge "$attempts" ]; then
              echo "dependency-fetch: attempt $attempt/$attempts outcome=$label, no attempts left"
              break
            fi
            pause=$((attempt * 30))
            echo "dependency-fetch: attempt $attempt/$attempts outcome=$label, retrying in $pause s"
            sleep "$pause"
            attempt=$((attempt + 1))
          done
          echo "::error::dependency fetch failed after $attempt of $attempts attempts: no mutation was run on shard $SHARD of 8 (see the cargo output above)"
          node -e 'const fs = require("fs"); const lines = fs.readFileSync(process.argv[1], "utf8").split(/\r?\n/).filter((l) => l.trim() && !/^\s*(Updating|Downloading)/.test(l)).slice(0, 20); fs.writeFileSync(process.argv[2], JSON.stringify({ refused: { shard: process.argv[3] + "/8", problems: ["dependency fetch failed after " + process.argv[4] + " of 3 attempts: no mutation was run"], output: lines } }, null, 1) + "\n");' "$log" "$RUNNER_TEMP/shard-$SHARD.json" "$SHARD" "$attempt"
          exit 1
      # The whole list each time, and a survivor verdict never comes from a subset of the
      # tests: a proof run's killers-first pass falls back to the full suite for any
      # mutation its recorded killers do not kill. Exit 1 is a mutation not killed: this step leaves it
      # to the report job, which judges every shard's results file together. Any other
      # non-zero exit is the runner refusing to start (the unmutated copy does not build or
      # pass; it has written a typed refusal in place of results): this job fails, so a
      # shard that ran nothing is never green.
      - name: Run this shard's mutations
        env:
          MODE: ${{ (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' && inputs.mode == 'proof') && 'proof' || 'full' }}
        run: |
          set +e
          # A proof run reads the committed records for their killer lists only; its shard's own
          # results file starts empty, so nothing old is counted as run.
          full=(--full)
          if [ "$MODE" = "proof" ]; then
            full=(--killers-from src-tauri/crates/bridge-tax-audit/parity/mutation-results.json)
          fi
          echo "mode: $MODE"
          node src-tauri/crates/bridge-tax-audit/parity/mutations.mjs \
            "${full[@]}" --jobs 2 --shard "${{ matrix.shard }}/8" \
            --workdir "$RUNNER_TEMP/mutants" \
            --results "$RUNNER_TEMP/shard-${{ matrix.shard }}.json" 2>&1 | tee "$RUNNER_TEMP/shard-${{ matrix.shard }}.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::shard ${{ matrix.shard }} of 8 ran nothing: the runner exited $rc (see its log above; a refusal because the unmutated copy failed is also in its results file)"
            exit "$rc"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/shard-${{ matrix.shard }}.log
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Judge every shard and track failures in one issue
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # Full history: the listing below compares this run's commit with the last green night's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-*
          path: shards
          merge-multiple: true
      # A shard that refused to run wrote a typed refusal: the report names it with its
      # reason and lists its ids apart. A shard that crashed before writing any file is not
      # a clean shard either: its mutations are absent from the merge, and the report lists
      # them as "not run", which fails the run. With no shard file at all, the merge reads one missing
      # file, so every id goes on the issue's failing-ids line.
      - name: Merge the shards and judge the whole list
        id: judge
        run: |
          set +e
          shopt -s nullglob
          files=(shards/shard-*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            files=(shards/no-shard-wrote-a-results-file.json)
          fi
          if node src-tauri/crates/bridge-tax-audit/parity/mutations.mjs \
            --merge "${files[@]}" --results mutation-results.json --report report.md; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          # A merge that crashed wrote no report. Without a failing-ids line the issue
          # holds every crate pull request until someone closes it by hand.
          if [ ! -f report.md ]; then
            echo "The merge step crashed before writing a report; see the run log." > report.md
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-results
          path: |
            mutation-results.json
            report.md
          if-no-files-found: warn
          retention-days: 30
      # The nightly run is the only check of the crate's outside inputs, so a failure says which of them
      # moved since the last green night. The last green run is read from the run list; when it cannot
      # be found or read, the reason goes into the listing, which then says it could not be computed.
      # That is never written as "none changed".
      - name: List the outside inputs changed since the last green night
        if: ${{ github.ref == 'refs/heads/master' && steps.judge.outputs.failed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set +e
          base=""
          reason=""
          if ! last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tax-audit-mutations-nightly.yml --branch master --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"; then
            reason="could not read the run list (the gh command failed)"
          elif [ -z "$last" ]; then
            reason="no earlier green run was found"
          else
            base="$last"
          fi
          if ! node scripts/nightly-outside-inputs.mjs --base "$base" --head "$HEAD_SHA" --reason "$reason" > outside-inputs.md || [ ! -s outside-inputs.md ]; then
            printf '## Outside inputs changed since the last green nightly\n\nCould not be computed: the listing step failed. This is not the same as "none changed": the list is unknown.\n' > outside-inputs.md
          fi
      # Only master's run speaks for master: a run dispatched on another branch
      # must not close, or rewrite the failing ids of, master's issue.
      - name: Open, update or close the tracking issue
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.judge.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create mutation-nightly --color B60205 \
            --description "The nightly bridge-tax-audit mutation run failed" --force
          # The oldest open issue, if several were opened by hand.
          open="$(gh issue list --label mutation-nightly --state open --limit 100 --json number --jq 'map(.number) | min // empty')"
          { echo "Run: $RUN_URL"; echo; cat report.md; } > body.md
          if [ "$FAILED" = "true" ]; then
            { echo; cat outside-inputs.md 2>/dev/null || printf '## Outside inputs changed since the last green nightly\n\nCould not be computed: the listing step did not run. This is not the same as "none changed": the list is unknown.\n'; } >> body.md
          fi
          if [ "$FAILED" = "true" ]; then
            if [ -n "$open" ]; then
              # The body carries the latest failing-ids line, which ci.yml reads.
              gh issue edit "$open" --body-file body.md
              gh issue comment "$open" --body-file body.md
            else
              gh issue create --label mutation-nightly \
                --title "Nightly tax-audit mutation run failed" --body-file body.md
            fi
            exit 1
          fi
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "The nightly run passed: every mutation killed on master. $RUN_URL"
            gh issue close "$open"
          fi
      - name: Fail a failing run on another branch
        if: ${{ github.ref != 'refs/heads/master' && steps.judge.outputs.failed == 'true' }}
        run: |
          cat report.md
          exit 1
