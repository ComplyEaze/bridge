<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">The approval window on Windows and on a Mac, drawn as a diagram</title>
<desc id="d">A drawing, not a screenshot. Windows: ComplyEaze Bridge, post this voucher? Buttons Yes, No, Cancel. Mac: ComplyEaze Bridge, approve one voucher. Buttons Cancel, Post voucher.</desc>
<rect width="720" height="240" fill="#f6f8fb"/>
<rect x="20" y="20" width="330" height="180" rx="10" fill="#fff" stroke="#c5ccd8"/>
<text x="40" y="46" font-size="12" fill="#5b6679" letter-spacing=".06em">WINDOWS</text>
<text x="40" y="72" font-size="13.5" fill="#0b1436" font-weight="700">ComplyEaze Bridge — post this voucher?</text>
<rect x="40" y="86" width="290" height="48" rx="5" fill="none" stroke="#9aa5ba" stroke-dasharray="5 4"/>
<text x="52" y="115" font-size="13" fill="#5b6679">The voucher is shown here.</text><rect x="40" y="150" width="60" height="28" rx="5" fill="#fff" stroke="#0b1436"/><text x="70.0" y="169" font-size="14" fill="#0b1436" text-anchor="middle" font-weight="600">Yes</text><rect x="110" y="150" width="60" height="28" rx="5" fill="#fff" stroke="#0b1436"/><text x="140.0" y="169" font-size="14" fill="#0b1436" text-anchor="middle" font-weight="600">No</text><rect x="180" y="150" width="80" height="28" rx="5" fill="#fff" stroke="#0b1436"/><text x="220.0" y="169" font-size="14" fill="#0b1436" text-anchor="middle" font-weight="600">Cancel</text>
<rect x="370" y="20" width="330" height="180" rx="10" fill="#fff" stroke="#c5ccd8"/>
<text x="390" y="46" font-size="12" fill="#5b6679" letter-spacing=".06em">MAC</text>
<text x="390" y="72" font-size="13.5" fill="#0b1436" font-weight="700">ComplyEaze Bridge — approve one voucher</text>
<rect x="390" y="86" width="290" height="48" rx="5" fill="none" stroke="#9aa5ba" stroke-dasharray="5 4"/>
<text x="402" y="115" font-size="13" fill="#5b6679">The voucher is shown here.</text><rect x="390" y="150" width="80" height="28" rx="5" fill="#fff" stroke="#0b1436"/><text x="430.0" y="169" font-size="14" fill="#0b1436" text-anchor="middle" font-weight="600">Cancel</text><rect x="480" y="150" width="120" height="28" rx="5" fill="#fff" stroke="#0b1436"/><text x="540.0" y="169" font-size="14" fill="#0b1436" text-anchor="middle" font-weight="600">Post voucher</text>
<text x="20" y="224" font-size="12" fill="#5b6679">A drawing, not a screenshot. Only Yes (Windows) or Post voucher (Mac) posts.</text>
</svg>